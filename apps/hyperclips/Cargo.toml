[package]
name = "hyperclips"
description = "Hyper Clips core: tray, hotkeys, capture service, CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "hyperclips"
path = "src/main.rs"

[dependencies]
clap.workspace = true
crossbeam-channel.workspace = true
hc-capture.workspace = true
hc-core.workspace = true
hc-detect.workspace = true
hc-encode.workspace = true
hc-library.workspace = true
hc-recorder.workspace = true
hc-hotkeys.workspace = true
tracing.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
