[package]
name = "hyperclips-studio"
description = "Hyper Clips studio: library, editor and settings UI (started on demand)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "hyperclips-studio"
path = "src/main.rs"

[features]
# OpenGL renderer: measured ~132 MB working set vs ~156-267 MB with wgpu
# (see docs/BENCHMARKS.md). A custom Direct3D 11 painter is planned for
# Phase 3, sharing the device used for hardware video decoding.
default = ["glow"]
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu"]

[dependencies]
eframe = { workspace = true, default-features = false, features = ["accesskit", "default_fonts"] }
hc-capture.workspace = true
hc-core.workspace = true
hc-editor.workspace = true
hc-encode.workspace = true
hc-hotkeys.workspace = true
hc-library.workspace = true
hc-plugins.workspace = true
hc-share.workspace = true
hc-vault.workspace = true
hc-updater.workspace = true
windows-core.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Threading",
]