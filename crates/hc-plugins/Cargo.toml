[package]
name = "hc-plugins"
description = "Sandboxed WebAssembly plugin host (wasmi interpreter) for Hyper Clips"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Pure-Rust interpreter. Default features minus `wat` (text parsing) and `memory64`.
wasmi = { version = "2.0.2", default-features = false, features = ["std", "validate", "stable", "auto-dispatch"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
wat = "1.263.0"

[lints]
workspace = true
