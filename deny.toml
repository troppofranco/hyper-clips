# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Everything here is compatible with GPL-3.0-or-later.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "LicenseRef-UFL-1.0",
]

[[licenses.clarify]]
# egui's bundled fonts (Ubuntu font licence) are not SPDX-tagged.
crate = "epaint_default_fonts"
expression = "(MIT OR Apache-2.0) AND OFL-1.1 AND LicenseRef-UFL-1.0"
license-files = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# Crates we never want in the tree: native TLS stacks, telemetry/analytics SDKs.
deny = [
    { crate = "openssl-sys", reason = "use rustls only" },
    { crate = "native-tls", reason = "use rustls only" },
    { crate = "sentry", reason = "no crash reporting / telemetry" },
    { crate = "opentelemetry", reason = "no telemetry" },
    { crate = "segment", reason = "no analytics" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
