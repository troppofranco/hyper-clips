# cargo-deny configuration (format of cargo-deny >= 0.16).
# Run: cargo deny check
# The license allow-list may need small additions the first time (egui font licenses etc.).

[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
yanked = "deny"
# Both are "unmaintained" notices (not vulnerabilities) pulled in only by the egui 0.31
# stack used by hyperclips-ui. Re-check when egui is upgraded and remove these entries.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; transitive via egui/accesskit, no vulnerability" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; transitive via egui fonts, no vulnerability" },
]

[licenses]
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "OFL-1.1",
    "BSL-1.0",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
