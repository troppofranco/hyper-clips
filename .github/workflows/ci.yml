# Phase 1 CI: the Windows code can only be compiled on Windows, so this is the first
# real check of hc-os-win. Release workflow (signing, installer) comes in Phase 5.
# TODO (Phase 5): pin every action to a full commit SHA.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Collect build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/hyperclips.exe, target/release/hyperclips-ui.exe, target/release/hc-updater-helper.exe dist/
          Copy-Item scripts/measure-memory.ps1 dist/
      - uses: actions/upload-artifact@v4
        with:
          name: hyperclips-windows-x64
          path: dist/
          retention-days: 14

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
