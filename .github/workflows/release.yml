name: Release

# Push a tag like v0.2.0 (stable) or v0.2.0-beta.1 (pre-release).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version from tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $cv = ($meta.packages | Where-Object name -eq 'hyperclips').version
          if ($cv -ne $v) { Write-Error "Cargo version $cv does not match tag $v"; exit 1 }
          "HC_VERSION=$v" >> $env:GITHUB_ENV
          if ($v -match '-') { "HC_PRERELEASE=--prerelease" >> $env:GITHUB_ENV } else { "HC_PRERELEASE=" >> $env:GITHUB_ENV }

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release --workspace

      - name: Portable zip
        shell: pwsh
        run: |
          $v = $env:HC_VERSION
          $d = "dist\HyperClips-$v"
          New-Item -ItemType Directory -Force $d | Out-Null
          foreach ($exe in 'hyperclips.exe','hyperclips-studio.exe','hc-updater-helper.exe') { Copy-Item "target\release\$exe" $d }
          Copy-Item -Recurse locales "$d\locales"
          Copy-Item LICENSE, README.md, PRIVACY.md $d
          New-Item -ItemType File "$d\portable.flag" | Out-Null
          Compress-Archive -Path $d -DestinationPath "dist\HyperClips-$v-portable.zip"
          Remove-Item -Recurse -Force $d

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\hyperclips.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checksums
        shell: pwsh
        run: |
          Push-Location dist
          $lines = Get-ChildItem -File | Where-Object { $_.Name -match '\.(exe|zip)$' } | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$PWD\checksums.txt", ($lines -join "`n") + "`n")
          Pop-Location


      - name: Release notes
        shell: pwsh
        run: |
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($env:HC_VERSION))\].*?(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Value } else { "See CHANGELOG.md" }
          $notes += "`n`nSHA-256 of every file: see ``checksums.txt``."
          [IO.File]::WriteAllText("$PWD\notes.md", $notes)

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $args = @("release", "create", "${{ github.ref_name }}", "--title", "Hyper Clips $env:HC_VERSION", "--notes-file", "notes.md")
          if ($env:HC_PRERELEASE) { $args += $env:HC_PRERELEASE }
          $args += (Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh @args
