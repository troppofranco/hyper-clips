[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/troppofranco/hyper-clips"
publish = false

[workspace.dependencies]
hc-core = { path = "crates/hc-core" }
hc-buffer = { path = "crates/hc-buffer" }
hc-capture = { path = "crates/hc-capture" }
hc-detect = { path = "crates/hc-detect" }
hc-editor = { path = "crates/hc-editor" }
hc-encode = { path = "crates/hc-encode" }
hc-hotkeys = { path = "crates/hc-hotkeys" }
hc-library = { path = "crates/hc-library" }
hc-plugins = { path = "crates/hc-plugins" }
hc-share = { path = "crates/hc-share" }
hc-recorder = { path = "crates/hc-recorder" }
hc-updater = { path = "crates/hc-updater" }
hc-vault = { path = "crates/hc-vault" }

clap = { version = "4.6.9", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", default-features = false }
fluent-bundle = "0.16.0"
getrandom = "0.4.3"
gif = "0.14.2"
serde_json = "1.0.154"
image-webp = "0.2.4"
nnnoiseless = { version = "0.5.2", default-features = false }
rusqlite = { version = "0.43.0", features = ["bundled"] }
minisign = "0.10.0"
minisign-verify = "0.3.0"
semver = "1.0.28"
sha2 = "0.11.1"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tiny_http = "0.12.0"
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "registry", "ansi"] }
unic-langid = "0.9.6"
windows = "0.62.2"
windows-core = "0.62.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Faster local iteration on the heavy UI deps while keeping our code debuggable.
[profile.dev.package."*"]
opt-level = 2
